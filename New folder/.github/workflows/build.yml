name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: melody_music
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --org com.melodymusic --project-name melody_music --platforms android
      - name: Patch Android audio service and permissions
        run: |
          rm -f test/widget_test.dart
          python3 tools/patch_android.py
      - name: Install dependencies
        run: flutter pub get
      - name: Fix file_picker Android compile SDK
        run: |
          python3 tools/fix_file_picker_sdk.py
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          if p.exists():
              s=p.read_text().replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36')
              p.write_text(s)
          else:
              p=Path('android/app/build.gradle')
              if p.exists():
                  import re
                  s=p.read_text()
                  s=re.sub(r'compileSdk(?:Version)?\s+flutter\.compileSdkVersion','compileSdk 36',s)
                  p.write_text(s)
          PYCODE
      - name: Verify Android SDK 36 settings
        run: |
          grep -n "compileSdk" android/app/build.gradle* || true
          python3 tools/fix_file_picker_sdk.py
      - name: Generate app icons
        run: dart run flutter_launcher_icons
      - name: Analyze (informational)
        run: flutter analyze || true
      - name: Run tests (informational)
        run: flutter test || true
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: melody-music-apk
          path: melody_music/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

