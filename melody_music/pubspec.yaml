name: melody_music
description: Melody Music - premium offline-first music player
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

# ملاحظة: الإصدارات أدناه كتبتها من الذاكرة دون إمكانية التحقق (لا إنترنت في بيئتي).
# إن فشل `flutter pub get` بسبب إصدار، شغّل: flutter pub upgrade --major-versions
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  audio_metadata_reader: ^1.2.0
  palette_generator: ^0.3.3+4
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0B0A12"
  adaptive_icon_foreground: assets/icon/icon_fg.png

flutter:
  uses-material-design: true
  # خط Cairo (ترخيص OFL): نزّل Cairo-Regular/SemiBold/Bold.ttf من fonts.google.com
  # إلى assets/fonts/ ثم أزل التعليق. لا نستخدم google_fonts كي يعمل التطبيق دون إنترنت.
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
